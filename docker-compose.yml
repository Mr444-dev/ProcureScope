name: procurescope

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurescope -d procurescope"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      S3_ENDPOINT_URL: http://minio:9000
    command: >
      bash -c "airflow db migrate &&
      (airflow users list --output table | grep -q \"$AIRFLOW_ADMIN_USERNAME\" ||
       airflow users create --username \"$AIRFLOW_ADMIN_USERNAME\"
       --password \"$AIRFLOW_ADMIN_PASSWORD\" --firstname Procure
       --lastname Scope --role Admin --email admin@example.local)"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      S3_ENDPOINT_URL: http://minio:9000
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - airflow-logs:/opt/airflow/logs

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      S3_ENDPOINT_URL: http://minio:9000
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - airflow-logs:/opt/airflow/logs

  metabase:
    image: metabase/metabase:v0.53.6
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: procurescope
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["manual"]
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    command: ["python", "-m", "procurescope.cli", "ingest"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["manual"]
    env_file:
      - .env
    environment:
      DBT_HOST: postgres
      DBT_USER: procurescope
      DBT_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_DATABASE: procurescope
      DBT_SCHEMA: analytics
      DBT_PORT: "5432"
    command: ["dbt", "build", "--project-dir", "/opt/airflow/app/dbt", "--profiles-dir", "/opt/airflow/app/dbt"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
